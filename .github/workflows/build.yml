name: Build iOS 10 armv7 App via Theos

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git perl curl rsync ccache unzip xz-utils fakeroot libio-compress-lzma-perl libtinfo6 librsvg2-bin

      - name: Generate app icons
        run: |
          set -eux
          mkdir -p TVRemote/Resources
          rsvg-convert -w 57 -h 57 TVRemote/Resources/tvhome-icon.svg -o TVRemote/Resources/Icon.png
          rsvg-convert -w 114 -h 114 TVRemote/Resources/tvhome-icon.svg -o TVRemote/Resources/Icon@2x.png
          rsvg-convert -w 114 -h 114 TVRemote/Resources/tvhome-icon.svg -o TVRemote/Resources/Icon-57.png
          rsvg-convert -w 120 -h 120 TVRemote/Resources/tvhome-icon.svg -o TVRemote/Resources/Icon-60.png
          file TVRemote/Resources/Icon.png TVRemote/Resources/Icon@2x.png TVRemote/Resources/Icon-57.png TVRemote/Resources/Icon-60.png

      - name: Install Theos
        env:
          CI: true
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Verify Theos toolchain and SDKs
        run: |
          set -eux
          echo "THEOS=$THEOS"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version
          find "$THEOS/sdks" -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort

      - name: Build package
        run: |
          set -eux
          make clean
          make package FINALPACKAGE=1

      - name: Show generated packages
        run: |
          find packages -maxdepth 1 -type f -print -exec file {} \; || true

      - name: Build IPA from application bundle
        run: |
          set -eux
          APP_PATH="$(find .theos/obj -type d -name 'TVRemote.app' -print -quit)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/TVRemote.app
          cd ipa
          zip -r ../TVRemote-iOS10-armv7.ipa Payload
          cd ..
          file TVRemote-iOS10-armv7.ipa
          unzip -l TVRemote-iOS10-armv7.ipa

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVRemote-deb-package
          path: packages/*.deb
          if-no-files-found: error

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVRemote-IPA-iOS10-armv7
          path: TVRemote-iOS10-armv7.ipa
          if-no-files-found: error
