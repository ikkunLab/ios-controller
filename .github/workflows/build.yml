name: Build iOS 10 armv7 App via Theos

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git perl curl rsync ccache unzip xz-utils fakeroot libio-compress-lzma-perl libtinfo6

      - name: Install Theos
        env:
          CI: true
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Verify Theos toolchain and SDKs
        run: |
          set -eux
          echo "THEOS=$THEOS"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version
          find "$THEOS/sdks" -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort

      - name: Build package
        run: |
          set -eux
          make clean
          make package FINALPACKAGE=1

      - name: Show generated packages
        run: |
          find packages -maxdepth 1 -type f -print -exec file {} \; || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVRemote-deb-package
          path: packages/*.deb
          if-no-files-found: error
