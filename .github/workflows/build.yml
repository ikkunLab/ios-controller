name: Build iOS Controller

on:
  push:
  workflow_dispatch:

jobs:
  build-experiment:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Validate project
        run: |
          plutil -lint TVRemote/Info.plist
          xcodebuild -project TVRemote.xcodeproj -list

      - name: Attempt modern iOS build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project TVRemote.xcodeproj \
            -scheme TVRemote \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: build.log
          if-no-files-found: warn
